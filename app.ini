APP_NAME = Gitea@MyMachine
RUN_USER = git
WORK_PATH = /var/lib/gitea

[repository]
; https://docs.gitea.com/administration/config-cheat-sheet/#repository-repository
DEFAULT_PRIVATE = private
DEFAULT_BRANCH = master

[repository.upload]
; https://docs.gitea.com/administration/config-cheat-sheet/#repository---upload-repositoryupload
; Deleted on restart - keep off the persistent volume
TEMP_PATH = /tmp/uploads

[repository.signing]
; https://docs.gitea.com/administration/config-cheat-sheet/#repository---signing-repositorysigning
DEFAULT_TRUST_MODEL = committer

[repository.local]
; https://docs.gitea.com/administration/config-cheat-sheet/#repository---local-repositorylocal
; Deleted on restart - keep off the persistent volume
LOCAL_COPY_PATH = /tmp/local-repo

[ui]
; https://docs.gitea.com/administration/config-cheat-sheet/#ui-ui
SHOW_USER_EMAIL = false

[server]
; https://docs.gitea.com/administration/config-cheat-sheet/#server-server
APP_DATA_PATH = /var/lib/gitea
ROOT_URL = ${ROOT_URL}
HTTP_PORT = ${HTTP_PORT}
PUBLIC_URL_DETECTION = never
START_SSH_SERVER = true
SSH_PORT = ${SSH_PORT}

[database]
; https://docs.gitea.com/administration/config-cheat-sheet/#database-database
DB_TYPE = sqlite3

[security]
; https://docs.gitea.com/administration/config-cheat-sheet/#security-security
INSTALL_LOCK = true
SECRET_KEY_URI = file:///run/secrets/gitea_secret_key
INTERNAL_TOKEN_URI = file:///run/secrets/gitea_internal_token
MIN_PASSWORD_LENGTH = 10
PASSWORD_COMPLEXITY = lower,upper,digit

[service]
; https://docs.gitea.com/administration/config-cheat-sheet/#service-service
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = true
DEFAULT_KEEP_EMAIL_PRIVATE = true
ENABLE_TIMETRACKING = false
DEFAULT_ENABLE_TIMETRACKING = false
DEFAULT_USER_VISIBILITY = limited
DEFAULT_ORG_VISIBILITY = limited

[log]
; https://docs.gitea.com/administration/config-cheat-sheet/#log-log
LEVEL = Info
logger.router.MODE =

[oauth2]
; https://docs.gitea.com/administration/config-cheat-sheet/#oauth2-oauth2
JWT_SECRET_URI = file:///run/secrets/gitea_jwt_secret

[packages]
; https://docs.gitea.com/administration/config-cheat-sheet/#packages-packages
; Chunked upload temp dir - cleaned up after upload, keep off the persistent volume
CHUNKED_UPLOAD_PATH = /tmp/package-upload
